aid: emergence-capital
name: Emergence Capital
description: >-
  Emergence Capital is an early-stage venture capital firm founded in 2003 and headquartered in
  San Francisco, California, focused exclusively on early-stage B2B / enterprise software. Its
  founding thesis — that business software would move to the cloud — produced some of the defining
  SaaS bets of the era, including a contrarian 2003 investment in Salesforce and being the sole
  venture backer of Veeva's 2008 Series A. The firm runs a deliberately high-conviction, low-volume
  model in which each partner makes roughly one investment per year, enabling deep engagement with
  every founder. Its current thesis centers on "AI-native services" — companies that sell outcomes
  rather than software subscriptions, whose service margins improve as AI models improve — alongside
  AI infrastructure, physical-world AI, and horizontal and vertical SaaS. Emergence closed Fund VII
  at $1B in March 2025 (its largest fund, following Fund VI at $575M in 2021), has deployed less than
  $2.5B to generate $9B+ in realized returns, and its portfolio companies are collectively worth over
  $450B. Notable investments include Salesforce, Zoom, Veeva, Box, Bill.com, Gusto, Doximity, and
  Ironclad. Reported outcomes: 90%+ of early-stage investments raised successful follow-ons, 20%+
  surpassed a $1B valuation, and 10%+ went public.
